[package]
name = "inchat"
version = "0.1.0"
description = "Voice chat desktop app — Tauri + React + Cloudflare RealtimeKit"
authors = ["you"]
edition = "2021"

[lib]
name = "inchat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
