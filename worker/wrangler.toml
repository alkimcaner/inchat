# InChat API worker. See worker/src/index.ts for routes.
name = "inchat-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
# Preset guests join with. Must exist in your RealtimeKit app with meeting
# type "Voice" (e.g. a `voice_participant` preset created in the dashboard).
CLOUDFLARE_PRESET_NAME = "group_call_participant"
REALTIMEKIT_WEBHOOK_PUBLIC_KEY_URL = "https://api.realtime.cloudflare.com/.well-known/webhooks.json"

# D1 database holding rooms, messages, webhook dedupe + key cache.
# Create it, then paste the id:
#   bunx wrangler d1 create inchat
#   bunx wrangler d1 migrations apply inchat --local
#   bunx wrangler d1 migrations apply inchat --remote
[[d1_databases]]
binding = "DB"
database_name = "inchat"
database_id = "PASTE_D1_DATABASE_ID"
migrations_dir = "migrations"
